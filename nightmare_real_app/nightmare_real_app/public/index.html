<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NIGHTMARE</title><link rel="stylesheet" href="style.css"></head><body>
<div class="scan"></div><main class="wrap"><div class="logo">NIGHTMARE</div><div class="tag">SECURE ACCESS // AUTHENTICATION</div>
<section id="login" class="panel"><h1>LOGIN</h1><form id="loginForm"><label>USERNAME</label><input name="username" autocomplete="username" required><label>PASSWORD</label><input name="password" type="password" autocomplete="current-password" required><button>AUTHENTICATE</button></form><div id="loginMsg" class="msg"></div></section>
<section id="dash" class="panel hidden"><div class="top"><h1>ACCESS GRANTED</h1><button id="logout" class="small">LOGOUT</button></div><p id="identity" class="identity"></p><div class="tiles"><div class="tile"><small>SYSTEM</small><strong>ONLINE</strong></div><div class="tile"><small>LAB MODE</small><strong>LOCAL SAFE SIM</strong></div><div class="tile"><small>AUTH</small><strong>VERIFIED</strong></div></div><h2>BUG LAB</h2><p>Uji tampilan error, batas input, dan pemulihan UI di lingkungan lokal.</p><div class="buttons"><button id="bug">START GLITCH TEST</button><button id="reset" class="secondary">RESET</button></div><pre id="log">[SYSTEM] Waiting for command…</pre><div id="userAdmin" class="hidden"><h2>ACCOUNT CONTROL</h2><form id="createForm"><label>USERNAME BARU</label><input name="username" required minlength="3"><label>PASSWORD (12+)</label><input name="password" type="password" required minlength="12"><label>ROLE</label><select name="role"><option>Admin</option><option>VIP</option><option>Member</option></select><button>CREATE ACCOUNT</button></form><div id="createMsg" class="msg"></div><button id="loadUsers" class="secondary">REFRESH USERS</button><pre id="users"></pre></div></section></main><script src="app.js"></script></body></html>
